# ============================================================
# iosm3u8 — M3U8 下载器 (iPad) XcodeGen 工程定义
# 生成 .xcodeproj：xcodegen generate   （安装：brew install xcodegen）
# 修改本文件后需重新运行 xcodegen generate
# ============================================================
name: iosm3u8
options:
  bundleIdPrefix: com.m3u8dl
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "2"          # iPad
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  iosm3u8:
    type: application
    platform: iOS
    sources:
      - path: iosm3u8
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.m3u8dl.iosm3u8
        INFOPLIST_FILE: iosm3u8/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    dependencies:
      # ------------------------------------------------------
      # ffmpeg-kit 二进制（MP4 转换用，可选）。
      # 使用前需先下载 FFmpegKit.xcframework 到 Frameworks/ 目录
      # （下载地址见 README）；若暂不需要 MP4 转换，
      # 可删除本 dependency 块后重新运行 xcodegen。
      # ------------------------------------------------------
      - framework: Frameworks/FFmpegKit.xcframework
        embed: true

  iosm3u8Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: iosm3u8Tests
    dependencies:
      - target: iosm3u8
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.m3u8dl.iosm3u8Tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  iosm3u8:
    build:
      targets:
        iosm3u8: all
        iosm3u8Tests: [test]
    test:
      targets:
        - iosm3u8Tests
